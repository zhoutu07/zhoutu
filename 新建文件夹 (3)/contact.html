<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLFZ｜me的联系方式</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #3a3a3a;
            line-height: 1.7;
        }

        /* 导航栏 */
        nav {
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
        }
        nav a {
            display: block;
            padding: 16px 22px;
            text-decoration: none;
            color: #3a3a3a;
            transition: color 0.25s;
        }
        nav a:hover {
            color: #5B8DEF;
        }

        /* 主容器 */
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 社交图标区域 */
        .social-section {
            text-align:center;
        }
        .social-section h3{
            margin-bottom:20px;
            font-weight:500;
        }
        .social-links a{
            display:inline-block;
            width:46px;
            height:46px;
            line-height:46px;
            border-radius:50%;
            background:#ffffff;
            margin:0 8px;
            color:#5B8DEF;
            font-size:20px;
            text-decoration:none;
            box-shadow:0 2px 8px rgba(91,141,239,0.12);
            transition: all 0.2s ease;
            position: relative;
        }
        .social-links a:hover{
            background:#5B8DEF;
            color:#fff;
        }

        /* 邮箱悬浮提示框 */
        .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background:#333;
            color:#fff;
            padding:6px 12px;
            border-radius:6px;
            font-size:13px;
            white-space: nowrap;
            transition: opacity 0.2s;
            z-index:99;
        }
        .email-wrap:hover .tooltip{
            visibility: visible;
            opacity:1;
        }

        /* 页脚 */
        footer {
            text-align:center;
            padding:25px;
            color:#888;
            font-size:0.9rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="index.html">首页</a>

    </nav>

    <div class="container">
        <section class="social-section">
            <h3>联系我</h3>
            <div class="social-links">
                <a href="https://weibo.com/u/7440148448" target="_blank"><i class="fa fa-weibo"></i></a><!--微博-->
                <a href="https://www.douyin.com/user/MS4wLjABAAAAG5KYJvF8g3__4VFJObZ7UJcLhjqhhRorF3ZjsSAOLaU?from_tab_name=main" target="_blank"><i class="fa fa-music"></i></a><!--抖音-->
                <!--邮箱：悬浮显示，把下面引号内替换成你的真实邮箱-->
                <a class="email-wrap" href="mailto:xxx@example.com">
                    <i class="fa fa-envelope"></i>
                    <span class="tooltip">3802374435@qq.com</span>
                </a>
                <a href="http://3802374435.qzone.qq.com" target="_blank"><i class="fa fa-qq"></i></a><!--QQ-->
                <a href="https://www.xiaohongshu.com/user/profile/66ec20ab000000001d022813?xsec_token=ABjRhazDi5I37dnWbyM_hp1ahITid6q65QqB_mQYiW6xM%3D&xsec_source=pc_search" target="_blank"><i class="fa fa-book"></i></a><!--小红书-->
            </div>
        </section>
    </div>

    <footer>
        © 2026 TLFZ

</body>
</html>
