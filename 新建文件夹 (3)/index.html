<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZF｜首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #3a3a3a;
            line-height: 1.7;
        }

        /* 导航栏 */
        nav {
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
        }
        nav a {
            display: block;
            padding: 16px 22px;
            text-decoration: none;
            color: #3a3a3a;
            transition: color 0.25s;
        }
        nav a:hover {
            color: #5B8DEF;
        }

        /* 主容器 */
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 头部个人信息 */
        .profile-section {
            text-align: center;
            margin-bottom: 60px;
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 12px rgba(91, 141, 239, 0.18);
            margin-bottom: 22px;
        }
        .nickname {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom:10px;
        }
        .slogan {
            font-size:1.05rem;
            color:#666;
            margin-bottom:30px;
        }

        /* 页脚 */
        footer {
            text-align:center;
            padding:25px;
            color:#888;
            font-size:0.9rem;
        }

        /* 响应式适配 */
        @media(max-width:480px){
            .nickname{
                font-size:1.8rem;
            }
            .avatar{
                width:110px;
                height:110px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="index.html">首页</a>
            <a href="about.html">关于我</a>
            <a href="contact.html">联系我</a>
        </div>
    </nav>

    <div class="container">
        <section class="profile-section">
            <img class="avatar" src="avatar.jpg" alt="头像">
            <h1 class="nickname">LZF</h1>
            <p class="slogan">嗨嗨，这里是有趣的频道!一起玩耍吧~</p>
        </section>
    </div>

    <footer>
        © 2026 TLFZ
    </footer>
</body>
</html>
